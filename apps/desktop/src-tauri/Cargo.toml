[package]
name = "yana-desktop"
version = "0.1.0"
description = "YANA Native Windows AI Desktop Companion"
authors = ["YANA Core Team"]
edition = "2021"

[lib]
name = "yana_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tokio-test = "0.4"
